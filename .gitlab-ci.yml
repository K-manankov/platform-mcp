stages:
  - test
  - publish

default:
  image: node:20

.node_cache:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

test:
  stage: test
  extends: .node_cache
  tags:
    - dind
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check:versions
    - npm run typecheck
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

publish:
  stage: publish
  extends: .node_cache
  tags:
    - dind
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - |
      PKG_VERSION="$(node -p "require('./package.json').version")"
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "Версия в package.json ($PKG_VERSION) не совпадает с тегом ($TAG_VERSION)" >&2
        exit 1
      fi
    - |
      echo "@sonar:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
      echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish
